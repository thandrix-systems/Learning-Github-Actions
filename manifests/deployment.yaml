apiVersion: apps/v1
kind: Deployment
metadata:
  name: thandrix_app
  labels:
    app: thandrix_app
spec:
  replicas: 2    
  selector:
    matchLabels:
      app: thandrix_app
  template:
    metadata:
      labels:
        app: thandrix_app
    spec:
      containers:
        - name: thandrix-springboot
          image: ghcr.io/thandrix_systems/thandrix_app:latest
          ports:
            - containerPort: 8000
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"          