name: github-pipelines
#Let's add a comment to test the pipeline

on:
  push:
    branches:
      - main
      - dev
      - feature/*
      - deploy-using-kubectl
      
  # pull_request:
  #   types: [opened, synchronize, reopened]

permissions:
  actions: read
  security-events: write  
  packages: write
  contents: read 

jobs:
  ci-pipeline:
    uses: thandrix-systems/reusable-workflows/.github/workflows/ci-pipelines.yml@main
    with:
      run_codeql: true
      run_sonarqube: true
      run_publish_to_github_container_registry: true
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}

  deploy-with-kubectl:
    environment:
      name: Integration
    env:
      NAMESPACE: ${{ vars.NAMESPACE}}  
    needs: ci-pipeline
    runs-on: arc-runner-set
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up kubectl
        run: |
          curl -LO "https://storage.googleapis.com/kubernetes-release/release/$(curl -s https://storage.googleapis.com/kubernetes-release/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x ./kubectl
          sudo mv ./kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Configure Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          kubectl version
          kubectl get nodes

      - name: Install yq
        run: |
          sudo curl -L https://github.com/mikefarah/yq/releases/download/v4.30.6/yq_linux_amd64 -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
          yq --version
          
      - name: Update Deployment Image
        run: |
          IMAGE_TAGS="${{ github.run_id }}-${GITHUB_SHA::7}"
          IMAGE="ghcr.io/thandrix_systems/thandrix_app:${IMAGE_TAGS}"

          yq e ".spec.template.spec.containers[0].image = \"${IMAGE}\"" -i manifests/deployment.yaml
          cat manifests/deployment.yaml
      - name: Create Namespace if not exists
        run: |
          kubectl get namespace $NAMESPACE || kubectl create namespace $NAMESPACE

      - name: Create GHCR image pull secret
        run: |
          kubectl create secret docker-registry ghcr-pull-secret \
            --namespace "$NAMESPACE" \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="${{ secrets.GITHUB_TOKEN }}" \
            --dry-run=client -o yaml | kubectl apply -f -
         
      - name: Deploy to Kubernetes Cluster
        run: |
          kubectl apply -f manifests/ -n $NAMESPACE
      - name: Wait for Deployment Rollout
        run: |    
          kubectl rollout status deployment/thandrix-app -n $NAMESPACE
          kubectl get all -n $NAMESPACE  
