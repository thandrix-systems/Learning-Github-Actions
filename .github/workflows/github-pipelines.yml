name: github-pipelines
#Let's add a comment to test the pipeline

on:
  workflow_dispatch:
    inputs:
      run_codeql:
        description: 'Run CodeQL Analysis'
        required: false
        default: 'true'
      run_sonarqube:
        description: 'Run SonarQube Analysis'
        required: false
        default: 'true'
      run_publish_to_github_container_registry:
        description: 'Publish to GitHub Container Registry'
        required: false
        default: 'true'
        
  push:
    branches:
      - main
      - dev
      - feature/*
      - deploy-using-kubectl
      
  # pull_request:
  #   types: [opened, synchronize, reopened]

permissions:
  actions: read
  security-events: write  
  packages: write
  contents: read 

jobs:
  ci-pipeline:
    uses: thandrix-systems/reusable-workflows/.github/workflows/ci-pipelines.yml@main
    with:
      run_codeql: true
      run_sonarqube: true
      run_publish_to_github_container_registry: true
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}

  deploy:
    needs: ci-pipeline
    uses: thandrix-systems/reusable-workflows/.github/workflows/deploy-with-kubectl.yml@main
    with:
      ENVIRONMENT: ${{ vars.ENVIRONMENT }}
      NAMESPACE: ${{ vars.NAMESPACE }}
      IMAGE_NAME: ghcr.io/thandrix-systems/thandrix_app
    secrets:
      KUBECONFIG: ${{ secrets.KUBECONFIG }}
    
